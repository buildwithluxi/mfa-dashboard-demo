<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Workforce &amp; Overseas Missions Dashboard (concept demonstration)</title>
<style>
:root {
  color-scheme: light;
  --ink: #1b2430; --ink2: #4a5564; --muted: #6b7684; --line: #d9e0e8; --grid: #e8ecf1; --axis: #c3cad3;
  --bg: #f4f6f9; --card: #ffffff; --navy: #1f3a5f; --navy2: #2b4c7a;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --neutral: #898781;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --good-bg: #e4f4e4; --good-ink: #0b5c0b; --warn-bg: #fff3d6; --warn-ink: #7a5200; --crit-bg: #fbe6e6; --crit-ink: #9c2323;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; }

/* top bar and tabs */
.top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; }
.top .in { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 22px; max-width: 1440px; margin: 0 auto; }
.top h1 { font-size: 16px; font-weight: 650; letter-spacing: .1px; padding: 14px 0; white-space: nowrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; color: #fff; opacity: .72; padding: 15px 12px 12px; border-bottom: 3px solid transparent; white-space: nowrap; font-size: 14px; }
.tabs button:hover { opacity: 1; }
.tabs button[aria-selected="true"] { opacity: 1; border-bottom-color: #fff; font-weight: 600; }
.bar { background: #fff; border-bottom: 1px solid var(--line); }
.bar .in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 9px 22px; max-width: 1440px; margin: 0 auto; }
.bar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.bar select { border: 1px solid var(--line); border-radius: 14px; padding: 4px 8px; background: #fff; font-size: 13px; max-width: 190px; }
.chip { font-size: 12px; color: var(--ink2); border: 1px solid var(--line); border-radius: 14px; padding: 4px 10px; background: #fff; white-space: nowrap; }
.flag { background: var(--warn-bg); border: 1px solid #f0c477; color: var(--warn-ink); font-weight: 650; font-size: 12px; border-radius: 14px; padding: 4px 10px; white-space: nowrap; }
.bar .sp { flex: 1; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 11px; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--navy2); }
.btn.pri { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.lnk { background: none; border: 0; padding: 0; color: var(--navy2); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }

/* layout */
main { max-width: 1440px; margin: 0 auto; padding: 16px 22px 8px; display: grid; gap: 14px; }
main > * { min-width: 0; }   /* a wide table inside a view scrolls in its own box; it never widens the page */
.cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; }
.row.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.row.scen { grid-template-columns: minmax(0, 360px) minmax(0, 1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; text-align: left; display: block; width: 100%; }
button.card:hover { border-color: var(--navy2); box-shadow: 0 1px 6px rgba(31, 58, 95, .12); }
.card .l { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .v { font-size: 27px; font-weight: 700; margin: 2px 0 1px; color: var(--navy); letter-spacing: -.3px; }
.card .d { font-size: 12px; color: var(--ink2); }
.card .d.g { color: var(--good-ink); } .card .d.a { color: var(--warn-ink); } .card .d.r { color: var(--crit-ink); }
.card .more { font-size: 11px; color: var(--muted); white-space: nowrap; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 13px 15px; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.panel h3 { font-size: 14px; color: var(--navy); font-weight: 650; }
.lvl { display: inline-block; margin-left: 8px; font-size: 10.5px; font-weight: 600; color: var(--navy2); border: 1px solid #c5d3e6; background: #f1f5fb; border-radius: 9px; padding: 0 7px; vertical-align: 1px; letter-spacing: .02em; }
.ph select { border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; background: #fff; font-size: 12.5px; }
.ph label { white-space: nowrap; }
.sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.note { font-size: 12px; color: var(--ink2); background: #f8fafc; border: 1px solid var(--line); border-left: 3px solid var(--navy2); border-radius: 4px; padding: 8px 10px; margin-top: 10px; }
.note b { color: var(--ink); }
.src { font-size: 11px; color: var(--muted); margin-top: 8px; }
.rmark { border: 0; background: none; padding: 0; font-size: 11px; color: var(--warn-ink); text-decoration: underline dotted; text-underline-offset: 2px; }
.rmark.ok { color: var(--good-ink); }
.scroll { max-height: 330px; overflow: auto; }
.foot { max-width: 1440px; margin: 0 auto; padding: 6px 22px 22px; font-size: 11.5px; color: var(--muted); }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 7px; white-space: nowrap; position: sticky; top: 0; background: var(--card); }
td { padding: 6px 7px; border-bottom: 1px solid #eef1f4; vertical-align: middle; }
td.nw { white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #f3f7fc; }
tr.tot td { font-weight: 650; border-top: 1px solid var(--axis); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill i { font-style: normal; font-size: 10px; }
.pill.g { background: var(--good-bg); color: var(--good-ink); } .pill.a { background: var(--warn-bg); color: var(--warn-ink); }
.pill.r { background: var(--crit-bg); color: var(--crit-ink); } .pill.n { background: #eef1f4; color: var(--ink2); }
.hb { height: 8px; background: #eef1f4; border-radius: 4px; min-width: 70px; position: relative; }
.hb > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--s1); }
.hb > em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.dv { height: 10px; position: relative; min-width: 120px; }
.dv::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.dv > span { position: absolute; top: 0; bottom: 0; }
.dv > span.neg { right: 50%; background: var(--s1); border-radius: 4px 0 0 4px; } .dv > span.pos { left: 50%; background: var(--crit); border-radius: 0 4px 4px 0; }

/* charts */
.chart { width: 100%; min-height: 60px; }
.chart svg { display: block; overflow: visible; }
.grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--axis); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.cap { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
.hit { fill: transparent; } .hit.click { cursor: pointer; } .hit:hover, .hit:focus { fill: rgba(31, 58, 95, .05); outline: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.ln { height: 2px; width: 14px; vertical-align: 3px; border-radius: 1px; }
.seg { display: flex; gap: 2px; height: 28px; margin: 4px 0 2px; }
.seg > div { border-radius: 4px; color: #fff; font-size: 12px; font-weight: 600; padding: 5px 0 0 6px; overflow: visible; white-space: nowrap; min-width: 2px; }
.tip { position: fixed; z-index: 60; display: none; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgba(27, 36, 48, .16); padding: 8px 10px; font-size: 12px; max-width: 280px; }
.tip .tt { color: var(--muted); margin-bottom: 3px; }
.tip .tr { display: flex; align-items: center; gap: 6px; } .tip .tr b { font-variant-numeric: tabular-nums; } .tip .tr span.lb { color: var(--ink2); }
.tip .key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }

/* attention list, scenarios, forms */
.att { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
.att button { display: flex; gap: 9px; align-items: flex-start; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.att button:hover { border-color: var(--navy2); }
.att .t { font-size: 13px; font-weight: 600; } .att .d { font-size: 12px; color: var(--muted); }
.scn { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.scn .s { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; min-width: 0; }
.scn .s.base { background: #f8fafc; } .scn .s.edit { border-color: var(--navy2); box-shadow: 0 0 0 1px var(--navy2); }
.scn h4 { font-size: 13.5px; color: var(--navy); margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
.scn h4 i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid #eef1f4; align-items: baseline; }
.kv > span { color: var(--ink2); } .kv b { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.kv .dl { display: block; font-weight: 400; font-size: 11.5px; margin-top: 1px; }
.sl { margin: 0 0 11px; } .sl .lb { display: flex; justify-content: space-between; font-size: 12.5px; gap: 8px; } .sl .lb b { white-space: nowrap; }
.sl input[type=range] { width: 100%; margin: 3px 0 0; accent-color: var(--navy); }
.seg2 { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.field { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #eef1f4; font-size: 13px; }
.field input { width: 76px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; text-align: right; }
.field small { display: block; color: var(--muted); font-size: 11.5px; }
input.search { border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; width: 100%; max-width: 320px; }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; font-size: 12px; margin: 0 4px 4px 0; background: #fff; }
.kvg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; margin-bottom: 10px; }
h4.sec { font-size: 12.5px; color: var(--navy); margin: 14px 0 5px; }

/* ask */
body[data-tab="ask"] .bar label, body[data-tab="officer"] .bar label { display: none; }
.panel.ask { padding: 18px 20px 14px; }
.panel.ask h2 { font-size: 19px; color: var(--navy); }
.askhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.how { font-size: 12.5px; color: var(--ink2); margin-top: 7px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #c5d3e6; border-top-color: var(--navy); border-radius: 50%; animation: spin .8s linear infinite; margin-right: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.askrow { display: flex; gap: 8px; }
.askbox { flex: 1; min-width: 0; border: 1.5px solid var(--navy2); border-radius: 8px; padding: 11px 13px; font-size: 16px; background: #fff; }
.askbox:focus { outline: 3px solid #c9d9ef; }
.askrow .btn { padding: 0 20px; font-size: 15px; border-radius: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
.chipb { border: 1px solid #c5d3e6; background: #f1f5fb; color: var(--navy); border-radius: 16px; padding: 5px 12px; font-size: 13px; text-align: left; }
.chipb:hover { background: #e3ecf8; border-color: var(--navy2); }
.ans { display: grid; gap: 14px; }
.ans:empty { display: none; }
.panel.sum { border-left: 4px solid var(--navy); padding: 14px 18px; }
.und { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.und b { color: var(--navy); font-size: 14px; margin-right: 4px; }
.und .tag { margin: 0; }
.sumlist { margin: 10px 0 0; padding-left: 20px; font-size: 15.5px; line-height: 1.5; }
.sumlist li { margin-bottom: 5px; }
.sumlist b { color: var(--navy); }

.cbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 10px; margin-bottom: 12px; background: #f8fafc; border: 1px solid var(--line); border-radius: 6px; }
.cbar:empty { display: none; }
.cbar label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.cbar select { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: #fff; font-size: 13px; max-width: 210px; }

/* officer page */
.photo { margin: 0; flex: none; text-align: center; }
.photo svg { display: block; border: 1px solid var(--line); border-radius: 6px; }
.photo figcaption { font-size: 11px; color: var(--muted); margin-top: 4px; }
.ohead { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; padding: 18px 20px; }
.oid { flex: 1 1 260px; min-width: 0; }
.oid h2 { font-size: 26px; color: var(--navy); margin: 4px 0 2px; letter-spacing: -.3px; }
.otitle { font-size: 15px; color: var(--ink); margin-bottom: 10px; }
.otags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.otags .tag { margin: 0; }
.ostats { display: grid; grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 10px 22px; flex: 1 1 320px; }
.ostat .l { font-size: 12px; color: var(--muted); } .ostat .v { font-size: 22px; font-weight: 700; color: var(--navy); } .ostat .d { font-size: 12px; color: var(--ink2); }
.dhead { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }

/* drill-down drawer */
.scrim { position: fixed; inset: 0; background: rgba(27, 36, 48, .32); z-index: 40; display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100vw); background: #fff; z-index: 50; box-shadow: -8px 0 28px rgba(27, 36, 48, .2); transform: translateX(102%); transition: transform .18s ease; display: flex; flex-direction: column; }
body.drawer-open .scrim { display: block; } body.drawer-open .drawer { transform: none; }
.dh { display: flex; gap: 10px; align-items: flex-start; padding: 13px 16px 11px; border-bottom: 1px solid var(--line); }
.dh .dt { flex: 1; min-width: 0; } .dh h2 { font-size: 16px; color: var(--navy); }
.dh .x { border: 0; background: none; font-size: 24px; line-height: 1; color: var(--muted); padding: 0 4px; }
.db { padding: 12px 16px 24px; overflow: auto; flex: 1; }
.db .flag { display: inline-block; margin-bottom: 10px; }

@media (max-width: 1000px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row, .row.even, .row.scen { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .top .in { flex-direction: column; align-items: stretch; gap: 0; padding: 0 16px; }
  .top h1 { padding: 11px 0 0; font-size: 15px; }
  .tabs button { padding: 10px 10px 8px; }
  .bar .in, main { padding-left: 16px; padding-right: 16px; }
  .foot { padding-left: 16px; padding-right: 16px; }
  .bar select { max-width: 150px; }
  .card .v { font-size: 23px; }
  .scn { grid-template-columns: minmax(0, 1fr); }
  .kvg { grid-template-columns: minmax(0, 1fr); }
}
/* draft posting plan: signal strip, board of mission cards, selected post */
body[data-tab="plan"] .bar label, body[data-tab="officer"] .bar label, body[data-tab="setup"] .bar label, body[data-tab="mission"] .bar label, body[data-tab="compare"] .bar label, body[data-tab="dash"] .bar label, body[data-tab="req"] .bar label { display: none; }   /* the view filters do not apply on these pages */
/* Year filter: it applies to the Summary, Workforce and Missions finance views */
body[data-tab="forecasts"] .bar label.yr, body[data-tab="scenarios"] .bar label.yr, body[data-tab="evidence"] .bar label.yr { display: none; }
.bar select.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.note.yrn { margin: 0; border-left: 3px solid var(--navy); }
tr.cur td { background: #eef3fa; font-weight: 650; }
.btn.sm { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.printonly { display: none; }
.pb-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.pb-head h1 { font-size: 22px; line-height: 1.2; color: var(--navy); }
.pb-head .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.pb-tag { border: 1px solid var(--navy); background: #fff; color: var(--navy); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
.pb-strip { display: flex; flex-wrap: wrap; gap: 12px; }
.pb-sig { flex: 1 1 170px; min-width: 0; min-height: 138px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; transition: background .25s, border-color .25s; }
.pb-sig.wide { flex: 1.7 1 280px; }
.pb-sig:hover { border-color: var(--navy2); }
.pb-sig.flash { background: #dbe7f7; border: 2px solid var(--navy); padding: 10px 13px 11px; }
.pb-sig .l { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #56657a; }
.pb-sig .more { font-size: 15px; line-height: 1; color: #93a0b2; }
.pb-sig .v { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; font-size: 32px; line-height: 1.1; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.pb-sig .u { font-size: 16px; font-weight: 600; color: #56657a; }
.pb-sig .was { align-self: center; font-size: 12px; font-weight: 600; color: var(--navy); background: #fff; border-radius: 4px; padding: 1px 6px; }
.pb-sig .f { margin-top: auto; font-size: 12px; color: #56657a; display: flex; }
.pb-bar { height: 8px; border-radius: 4px; background: #e6ebf1; overflow: hidden; margin-top: 2px; }
.pb-bar > div { height: 8px; background: var(--navy); transition: width .25s; }
.pb-g { display: flex; align-items: center; gap: 8px; }
.pb-g + .pb-sup + .pb-g { margin-top: 5px; }
.pb-g .nm { width: 72px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.pb-g .n { font-size: 24px; line-height: 1.1; font-weight: 700; color: var(--navy); display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.pb-g .n .u { font-size: 13px; }
.pb-g .pb-pill { margin-left: auto; }
.pb-sup { display: flex; gap: 2px; height: 9px; }
.pb-sup > div { border-radius: 2px; transition: width .25s; }
.pb-sup .have { background: var(--navy); } .pb-sup .lack { background: var(--crit); } .pb-sup .spare { background: #b9c7d8; }
.pb-pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px 2px 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pb-pill.g { background: var(--good-bg); color: #0a6a0a; } .pb-pill.g svg { color: var(--good); }
.pb-pill.a { background: var(--warn-bg); color: #7a5300; } .pb-pill.a svg { color: #c98a00; }
.pb-pill.r { background: var(--crit-bg); color: #a52a2a; } .pb-pill.r svg { color: var(--crit); }
.pb-pill.n { background: #eef1f4; color: var(--ink2); padding-left: 9px; }
.pb-pill.navy { background: var(--navy); color: #fff; }
.pb-pips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.pb-pips .pip { width: 24px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9.5px; font-weight: 600; color: #3d4c60; }
.pb-pips .pip i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid; display: flex; align-items: center; justify-content: center; }

.dsh-add { border: 2px dashed #c5d3e6; background: none; border-radius: 8px; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--navy); font-size: 15px; font-weight: 600; }
.dsh-add b { font-size: 26px; line-height: 1; } .dsh-add span { font-size: 12px; font-weight: 400; color: var(--muted); } .dsh-add:hover { background: #f1f5fb; border-color: var(--navy2); }
.dsh-empty { padding: 22px 24px; } .dsh-empty h3 { font-size: 17px; color: var(--navy); } .dsh-empty ol { margin: 10px 0 14px; padding-left: 22px; font-size: 15px; line-height: 1.7; }
.dsh-ask { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; } .dsh-ask .btn { padding: 7px 14px; font-size: 14px; }
.dsh-ok { font-weight: 650; color: var(--good-ink); background: var(--good-bg); border-radius: 14px; padding: 5px 12px; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; border-radius: 8px; padding: 11px 16px; font-size: 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 24px rgba(27, 36, 48, .3); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; } .toast .lnk { color: #fff; font-size: 14px; font-weight: 600; }
@media (max-width: 900px) { .dsh-grid { grid-template-columns: minmax(0, 1fr); } .dsh-ctl { max-width: none; } }
@media print { .toast { display: none !important; } .dsh-grid { display: block; } .dsh-t { margin-bottom: 14px; } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* sortable column headings */
.ths { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.ths .ar { font-size: 9px; opacity: .4; } .ths:hover { color: var(--navy); } .ths:hover .ar { opacity: .9; }
th[aria-sort] .ths { color: var(--navy); } th[aria-sort] .ths .ar { opacity: 1; }
.ths:focus-visible { outline: 2px solid #c9d9ef; outline-offset: 2px; border-radius: 3px; }
@media print { .ths .ar { display: none; } }

/* Ask: suggested questions fold to one row once there is an answer */
.sug { display: flex; align-items: flex-start; gap: 10px; margin-top: 11px; } .sug .chips { margin-top: 0; flex: 1; min-width: 0; }
.sug .chips.one { flex-wrap: nowrap; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); }
.sug .chips.one .chipb { flex: none; } .sug-more { flex: none; margin-top: 7px; }
/* Scenarios: no change is not a warning */
.dl.same { font-size: 12px; color: var(--muted); }
/* My dashboard: one Edit button; tools only while editing */
.dsh-ctl { max-width: none; } .dsh-b.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.dsh-t.editing { outline: 2px solid var(--navy2); outline-offset: -1px; }
.dsh-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; margin: 0 0 8px; background: #f1f5fb; border: 1px solid #c5d3e6; border-radius: 6px; } .dsh-tools .sp { flex: 1; }
.dsh-tools .dsh-b { padding: 4px 10px; font-size: 12.5px; }
.dsh-lb { font-size: 12px; color: var(--muted); margin: 0 0 4px; }

/* scenarios for one mission */
.scn-for { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.scn-for select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; background: #fff; font-size: 13px; font-weight: 600; color: var(--navy); }
.kvsec { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 6px; padding-top: 7px; }

/* sample receipt at the end of the drill-down */
.rcpt { position: relative; overflow: hidden; background: #fffdf7; border: 1px solid #d8d2c2; border-radius: 4px; padding: 20px 22px 22px; max-width: 520px; margin: 0 auto; box-shadow: 0 2px 10px rgba(27, 36, 48, .10); font-size: 13.5px; color: #26221a; }
.rc-wm { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-24deg); font-size: 84px; font-weight: 800; letter-spacing: 8px; color: rgba(160, 60, 50, .09); pointer-events: none; white-space: nowrap; }
.rc-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; border-bottom: 2px solid #26221a; padding-bottom: 10px; margin-bottom: 12px; }
.rc-doc { font-size: 19px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; } .rc-iss { font-size: 12px; color: #6a6252; margin-top: 2px; }
.rc-no { text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; color: #4a4336; }
.rc-row { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; border-bottom: 1px dotted #cfc8b6; position: relative; }
.rc-row span { color: #6a6252; flex: none; } .rc-row b { font-weight: 600; text-align: right; } .rc-row.sm { font-size: 12.5px; border-bottom: 0; padding: 3px 0; }
.rc-amt { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 12px 0 6px; padding: 10px 12px; background: #f4efe0; border: 1px solid #d8d2c2; border-radius: 3px; position: relative; }
.rc-amt span { color: #6a6252; } .rc-amt b { font-size: 21px; font-variant-numeric: tabular-nums; }
.rc-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: 18px; position: relative; }
.rc-sig { border-top: 1px solid #8d8472; padding-top: 4px; min-width: 190px; font-size: 11.5px; color: #6a6252; }
.rc-stamp { transform: rotate(-9deg); margin-right: 6px; border: 3px double rgba(176, 44, 44, .7); color: rgba(176, 44, 44, .78); border-radius: 6px; padding: 3px 12px 4px; font-weight: 800; font-size: 19px; letter-spacing: 3px; text-align: center; line-height: 1.1; pointer-events: none; }
.rc-stamp small { display: block; font-size: 10px; letter-spacing: .5px; font-weight: 600; }

.dsh-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.dsh-role { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .dsh-role .lb { font-size: 12.5px; color: var(--muted); margin-right: 2px; }
.dsh-rn { margin-left: 10px; font-size: 12.5px; font-weight: 600; color: var(--navy2); background: #e3ecf8; border-radius: 12px; padding: 3px 10px; vertical-align: 3px; letter-spacing: 0; }
@media (max-width: 900px) { .dsh-right { align-items: flex-start; flex: 1 1 100% !important; min-width: 0; } .dsh-acts { justify-content: flex-start; } }
/* scenarios: what each option changes */
.scn-as { font-size: 12px; color: var(--ink2); background: #f6f8fb; border: 1px solid var(--grid); border-radius: 4px; padding: 5px 8px; margin: 2px 0 6px; line-height: 1.4; } .scn-as b { display: block; color: var(--ink); font-size: 11.5px; }
.dsh-head > div:first-child { flex: 1 1 420px; min-width: 0; } .dsh-right { flex: none; }
/* needs attention on My dashboard: an even grid on a wide screen (six items sit three and three), the usual wrapping below that */
@media (min-width: 1101px) { .att.att-n { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); } }
/* a vacant post on the organisation chart is a way into the draft posting plan */
.oc-b .go { font-size: 11px; font-weight: 650; color: var(--navy2); margin-top: 3px; } button.oc-b.vac { cursor: pointer; } button.oc-b.vac:hover { background: #f1f5fb; }
.oc-b.vac.dr { border-left-style: solid; background: #f1f5fb; } .oc-b.vac.dr .s { color: var(--navy); font-weight: 600; }
/* draft posting plan: one mission at a time */
.pb-msel { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: #56657a; }
.pb-msel select { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: #fff; font-size: 13px; color: var(--ink); max-width: 270px; }
.pb-m button.nm { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: inherit; cursor: pointer; text-align: left; min-width: 0; }
.pb-m button.nm:hover { color: var(--navy2); text-decoration: underline; }
.cards.pb-mc { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } .pb-mc .card { padding: 10px 12px; } .pb-mc .card .v { font-size: 23px; } .pb-mc .card .v .u { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.pb-tbl { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; } .pb-tbl th:first-child, .pb-tbl td:first-child { padding-left: 14px; } .pb-tbl td { padding-top: 8px; padding-bottom: 8px; }
.pb-tbl tr.dimrow td { opacity: .4; } .pb-tbl tr.cur td { background: #eef3fa; font-weight: 650; box-shadow: inset 3px 0 0 var(--navy); } .pb-tbl tr.cur td + td { box-shadow: none; }
.pb-one { font-size: 12.5px; color: #56657a; }
@media (max-width: 900px) { .cards.pb-mc { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pb-msel { margin-left: 0; } }

.pb-gap { width: 1px; align-self: stretch; background: var(--line); margin: 0 5px; }
.pb-stayh { font-size: 12.5px; color: #56657a; margin-top: 2px; } .pb-stayh b { color: var(--ink2); }

.seg > div.click { cursor: pointer; } .seg > div.click:hover { filter: brightness(1.08); }
.legend button.lgb { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; } .legend button.lgb:hover { color: var(--navy2); text-decoration: underline; }

  const heads = officers.filter(o => o.grade === 'I').slice(0, MISSIONS.length);
  heads.forEach((o, i) => { o.loc = MISSIONS[i].id; o.title = 'Head of Mission'; });
  const pool = officers.filter(o => !o.loc && o.grade !== 'I' && o.age < 58.5);
  let pi = 0;
  MISSIONS.forEach(m => { for (let i = 1; i < m.hc; i++) pool[pi++].loc = m.id; });
  officers.forEach(o => { if (!o.loc) o.loc = 'HQ'; });
  officers.sort((a, b) => a.joined - b.joined);
  // the newest intake: nobody joins after the data date (service is floored at 0.3 years above)
  officers.forEach(o => { if (yearsBetween(o.joined, AS_AT) < o.service) o.joined = addYears(AS_AT, -o.service); });

  const overseasList = officers.filter(o => o.loc !== 'HQ');
  const overdueSet = new Set(shuffle(overseasList.filter(o => o.title !== 'Head of Mission')).slice(0, 14));

  officers.forEach((o, i) => {
    o.id = 'OFF-' + String(i + 1).padStart(4, '0');
    o.dept = pick(DEPTS);
    const overseas = o.loc !== 'HQ';
    if (!o.title) {
      if (overseas) o.title = o.grade === 'II' ? (o.tig > 6 ? 'Counsellor' : o.tig > 3 ? 'First Secretary' : 'Second Secretary') : (o.tig > 4 ? 'Third Secretary' : 'Attaché');
      else o.title = o.grade === 'I' ? 'Director' : o.grade === 'II' ? (o.tig > 6 ? 'Deputy Director' : o.tig > 3 ? 'Assistant Director' : 'Senior Desk Officer') : (o.tig > 4 ? 'Desk Officer' : 'Executive Officer');
    }
    // posting history, built backwards from today
    o.past = [];
    let cursor;
    if (overseas) {
      const el = overdueSet.has(o) ? rnd(3.05, 4.1) : rnd(0.08, 2.95);
      o.postStart = addYears(AS_AT, -Math.min(el, o.service - 0.1));
      cursor = addYears(o.postStart, -rnd(1.5, 4));
    } else {
      cursor = addYears(AS_AT, -rnd(0.2, 5.5));
    }
    let n = Math.max(0, Math.min(5, Math.floor((o.service - 2) / rnd(6, 10))));
    while (n-- > 0) {
      const len = 2.4 + R() + R();
      const from = addYears(cursor, -len);
      if (from < addYears(o.joined, 1)) break;
      o.past.unshift({ mission: pick(MISSIONS).id, from, to: cursor, len });
      cursor = addYears(from, -rnd(1.5, 4));
    }
    o.homeSince = overseas ? null : (o.past.length ? o.past[o.past.length - 1].to : o.joined);
    // training days this year, competencies, leadership programme
    const mean = { I: 3.6, II: 4.9, III: 2.2 }[o.grade] * (overseas ? 0.8 : 1.12);
    o.train = poisson(mean);
    const tilt = Math.max(-1, Math.min(1, (o.age - 42) / 16));
    o.skills = SKILLS.filter(s => R() < (s[1] + s[2] * tilt) * (o.grade === 'III' ? 0.8 : 1.15)).map(s => s[0]);
    o.prog = R() < (o.tig >= 3 ? 0.62 : 0.22);
  });

  /* ---------- career history (illustrative), for the officer page ----------
     Its own random stream, so no figure elsewhere changes. Each officer gets the grades held since
     joining (ending at the current grade and its start date) and training days for earlier years. */
  const R4 = mulberry(4040);
  officers.forEach(o => {
    const gap = yearsBetween(o.joined, o.gradeSince), ladder = ['IV', 'III', 'II', 'I'], ci = ladder.indexOf(o.grade);
    let k = gap < 0.6 ? 0 : gap < 7 ? 1 : gap < 15 ? (R4() < 0.55 ? 2 : 1) : (R4() < 0.3 ? 3 : 2);   // grades held before the current one
    k = Math.min(k, ci, o.grade === 'I' ? 2 : 3);
    const cuts = Array.from({ length: Math.max(0, k - 1) }, () => 0.25 + 0.5 * R4()).sort((x, y) => x - y);
    o.grades = [];
    for (let i = 0; i < k; i++) o.grades.push({ g: ladder[ci - k + i], from: i ? addYears(o.joined, gap * cuts[i - 1]) : o.joined });
    o.grades.push({ g: o.grade, from: k ? o.gradeSince : o.joined });
    o.trainHist = { 2026: o.train };
    [2025, 2024, 2023].forEach(y => { if (o.joined.getFullYear() <= y) o.trainHist[y] = Math.max(0, Math.round(o.train + 1.5 + (R4() - 0.5) * 5)); });
  });

  /* ---------- training conducted (illustrative), behind the training-day figures ----------
     Its own random stream again. Every course runs twice a year (January to May, June to October), and
     each officer's training days for a year are broken into sessions of those courses, so the days on
     the officer record, the list of courses attended and the attendance of each session all agree. */
  // title, category, days, provider, place, grades that attend (blank: all)
  const COURSES = [
    ['Protocol and ceremonial refresher', 'Protocol', 1, 'In-house', 'Headquarters'],
    ['Records and information security briefing', 'Administration', 1, 'In-house', 'Headquarters'],
    ['Consular case handling workshop', 'Consular', 1, 'In-house', 'Headquarters'],
    ['Media handling for diplomats', 'Public diplomacy', 1, 'External trainer', 'Headquarters'],
    ['Financial regulations for missions', 'Finance and administration', 1, 'In-house', 'Online'],
    ['Cyber awareness for overseas staff', 'Digital', 1, 'In-house', 'Online'],
    ['Negotiation skills workshop', 'Diplomacy', 2, 'External trainer', 'Headquarters'],
    ['Drafting and reporting for diplomats', 'Diplomacy', 2, 'In-house', 'Headquarters'],
    ['Mission accounts and procurement', 'Finance and administration', 2, 'In-house', 'Online'],
    ['Consular emergency exercise', 'Consular', 2, 'In-house', 'Headquarters'],
    ['Economic and trade diplomacy seminar', 'Economic', 2, 'External trainer', 'Headquarters'],
    ['Digital policy and cyber diplomacy', 'Digital', 2, 'External trainer', 'Online'],
    ['International law of treaties', 'International law', 3, 'Partner academy', 'Overseas'],
    ['Multilateral diplomacy and UN procedure', 'Diplomacy', 3, 'Partner academy', 'Overseas'],
    ['ASEAN affairs course', 'Regional', 3, 'In-house', 'Headquarters'],
    ['Management and supervision', 'Leadership', 3, 'Civil service training', 'Bandar Seri Begawan', 'II,III'],
    ['Pre-posting orientation', 'Posting', 3, 'In-house', 'Headquarters'],
    ['Arabic language intensive', 'Language', 5, 'Language centre', 'Bandar Seri Begawan'],
    ['Mandarin language intensive', 'Language', 5, 'Language centre', 'Bandar Seri Begawan'],
    ['French language intensive', 'Language', 5, 'Language centre', 'Bandar Seri Begawan'],
    ['Senior management seminar', 'Leadership', 5, 'Civil service training', 'Bandar Seri Begawan', 'I,II'],
    ['Advanced diplomatic practice', 'Diplomacy', 5, 'Partner academy', 'Overseas', 'I,II'],
  ].map((a, i) => ({ i, title: a[0], cat: a[1], days: a[2], provider: a[3], place: a[4] === 'Headquarters' ? 'Headquarters, by video link for missions' : a[4], home: a[4] === 'Bandar Seri Begawan', grades: a[5] ? a[5].split(',') : null }));
  const SESSIONS = [], sesByKey = {};
  const monday = d => { d.setDate(d.getDate() + (8 - d.getDay()) % 7); return d; };     // sessions start on a Monday
  function session(c, y, run) {
    const k = c.i + '-' + y + '-' + run;
    if (!sesByKey[k]) {
      const d = monday(new Date(y, run * 5 + c.i % 5, 3 + (c.i * 7 + y * 3 + run * 11) % 20));
      SESSIONS.push(sesByKey[k] = { id: 'TR-' + y + '-' + String(c.i * 2 + run + 1).padStart(2, '0'), course: c, year: y, start: d, days: c.days, attendees: [] });
    }
    return sesByKey[k];
  }
  // courses held only in Brunei are not taken by an officer who is posted overseas on that date
  const abroad = (o, d) => (o.loc !== 'HQ' && d >= o.postStart) || o.past.some(p => d >= p.from && d <= p.to);
  const R5 = mulberry(5050);
  officers.forEach(o => {
    o.courses = [];
    Object.keys(o.trainHist).forEach(ys => {
      const y = +ys, taken = new Set();
      let left = o.trainHist[y], guard = 0;
      while (left > 0 && guard++ < 40) {
        const open = COURSES.filter(c => c.days <= left && !taken.has(c.i) && (!c.grades || c.grades.includes(o.grade)))
          .map(c => [c, [0, 1].map(run => session(c, y, run)).filter(se => se.start > o.joined && !(c.home && abroad(o, se.start)))]).filter(x => x[1].length);
        if (!open.length) break;
        const top = Math.max(...open.map(x => x[0].days)), want = R5() < 0.55 ? top : open[Math.floor(R5() * open.length)][0].days;
        const same = open.filter(x => x[0].days === want), prev = same.filter(x => !o.courses.some(se => se.course === x[0]));
        const from = prev.length ? prev : same, ch = from[Math.floor(R5() * from.length)], se = ch[1][Math.floor(R5() * ch[1].length)];
        taken.add(ch[0].i); se.attendees.push(o); o.courses.push(se); left -= se.days;
      }
      if (left > 0) {   // joined too late in the year for a scheduled session: an induction on joining
        const st = monday(new Date(Math.min(o.joined.getTime() + 7 * 864e5, (y === AS_AT.getFullYear() ? AS_AT : new Date(y, 11, 24)).getTime() - 12 * 864e5)));
        const se = { id: 'TR-' + y + '-N' + o.id.slice(4), course: { i: -1, title: 'Induction for new officers', cat: 'Induction', days: left, provider: 'In-house', place: 'Headquarters' }, year: y, start: st, days: left, attendees: [o] };
        SESSIONS.push(se); o.courses.push(se);
      }
    });
    o.courses.sort((a, b) => b.start - a.start);
  });
  SESSIONS.sort((a, b) => a.start - b.start);

  /* ---------- workforce rules and forecasts ---------- */
  const DEF_RULES = { retAge: 60, postLen: 3, postLenHard: 3, homeTour: 2 };
  const retDate = (o, rules) => new Date(o.dob.getFullYear() + rules.retAge, o.dob.getMonth(), o.dob.getDate());
  const postLen = (m, rules) => (m.hardship ? rules.postLenHard : rules.postLen);
  const rotDue = (o, rules) => (o.loc === 'HQ' ? null : addYears(o.postStart, postLen(M[o.loc], rules)));
  const isOverdue = (o, rules) => o.loc !== 'HQ' && rotDue(o, rules) < AS_AT;

  // leavers other than retirement, last three years (illustrative history)
  const ATTR_HIST = [
    { y: 2023, I: [0, 43], II: [4, 228], III: [5, 131] },
    { y: 2024, I: [1, 43], II: [5, 229], III: [4, 136] },
    { y: 2025, I: [0, 42], II: [4, 230], III: [4, 139] },
  ];
  const ATTR_RATE = {};
  GRADES.forEach(g => {
    const l = ATTR_HIST.reduce((s, h) => s + h[g][0], 0), n = ATTR_HIST.reduce((s, h) => s + h[g][1], 0);
    ATTR_RATE[g] = { leavers: l, base: n, rate: l / n };
  });

  function wfForecast(list, rules, opts) {
    opts = opts || {};
    const from = 2027, to = 2031, intake = opts.intake || 0;
    const n = { I: 0, II: 0, III: 0 };
    list.forEach(o => n[o.grade]++);
    const years = [];
    let head = list.length;
    for (let y = from; y <= to; y++) {
      const row = { y, ret: { I: 0, II: 0, III: 0 }, attr: { I: 0, II: 0, III: 0 }, retList: [] };
      list.forEach(o => {
        const ry = retDate(o, rules).getFullYear();
        if (ry === y || (y === from && ry < from && ry >= 2026 && retDate(o, rules) > AS_AT) || (y === from && retDate(o, rules) <= AS_AT)) { row.ret[o.grade]++; row.retList.push(o); }
      });
      GRADES.forEach(g => { row.attr[g] = Math.max(0, n[g]) * ATTR_RATE[g].rate; n[g] -= row.ret[g] + row.attr[g]; });
      row.retT = row.ret.I + row.ret.II + row.ret.III;
      row.attrT = row.attr.I + row.attr.II + row.attr.III;
      row.total = row.retT + row.attrT;
      const sd = 1.28 * Math.sqrt(row.attrT);          // 80% range on the uncertain part only
      row.lo = row.retT + Math.max(0, row.attrT - sd); row.hi = row.retT + row.attrT + sd;
      head = head - row.total + intake;
      row.head = head;
      years.push(row);
    }
    return years;
  }

  function next12(list, rules) {
    const end = addYears(AS_AT, 1);
    const rets = list.filter(o => { const d = retDate(o, rules); return d <= end; });
    let attr = 0;
    list.forEach(o => { attr += ATTR_RATE[o.grade].rate; });
    return { rets, attr };
  }

  // succession: who could fill the vacancies opening in a grade, from the grade below
  const SUCC_RULE = { I: { from: 'II', tig: 5, posting: 1 }, II: { from: 'III', tig: 4, posting: 0 } };
  function succession(list, rules, horizon) {
    const fc = wfForecast(list, rules).filter(r => r.y <= horizon);
    return GRADES.map(g => {
      const vac = fc.reduce((s, r) => s + r.ret[g] + r.attr[g], 0);
      const rule = SUCC_RULE[g];
      if (!rule) return { grade: g, vac, intake: true };
      const cands = list.filter(o => o.grade === rule.from && retDate(o, rules).getFullYear() > horizon + 2 && o.past.length + (o.loc !== 'HQ' ? 1 : 0) >= rule.posting);
      const now = cands.filter(o => o.tig >= rule.tig && o.prog);
      const soon = cands.filter(o => !(o.tig >= rule.tig && o.prog) && o.tig >= rule.tig - 2);
      return { grade: g, vac, now, soon, rule, depth: vac > 0 ? now.length / vac : Infinity };
    });
  }

  function skillsGap(list, rules, horizon) {
    const ready = new Set();
    succession(list, rules, horizon).forEach(s => (s.now || []).concat(s.soon || []).forEach(o => ready.add(o)));
    return SKILLS.map(s => {
      const holders = list.filter(o => o.skills.includes(s[0]));
      const leaving = holders.filter(o => retDate(o, rules).getFullYear() <= horizon);
      const senior = holders.filter(o => o.grade !== 'III');
      const seniorLeaving = senior.filter(o => retDate(o, rules).getFullYear() <= horizon);
      return { skill: s[0], holders, leaving, share: holders.length ? leaving.length / holders.length : 0,
        senior, seniorLeaving, seniorShare: senior.length ? seniorLeaving.length / senior.length : 0,
        pipeline: holders.filter(o => ready.has(o)) };
    });
  }

  // officers at headquarters who meet the posting criteria; evidence only, never ranked
  function eligiblePool(grade, mission, rules) {
    const len = mission ? postLen(mission, rules) : rules.postLen;
    return officers.filter(o => o.loc === 'HQ' && o.grade === grade
      && yearsBetween(o.homeSince, AS_AT) >= rules.homeTour
      && yearsBetween(AS_AT, retDate(o, rules)) >= len + 1);
  }

  /* ---------- overseas missions finance ---------- */
  const flat = Array(12).fill(1);
  const LINES = [
    { id: 'allow', name: 'Foreign service allowances', unit: m => 70e3 * (0.55 + 0.45 * m.col), fx: 0.5, growth: 0, season: flat },
    { id: 'housing', name: 'Housing and rent', unit: m => 52e3 * m.rent, fx: 1, growth: 0.03, season: flat },
    { id: 'edu', name: "Children's education", unit: m => 16e3 * m.col, fx: 1, growth: 0.04, season: [1.7, .8, .8, .8, .8, .8, .8, 1.7, 1.4, .8, .8, .8] },
    { id: 'passage', name: 'Passage and relocation', unit: () => 13e3, fx: 0.3, growth: 0.02, season: [.8, .8, .8, .8, .8, 1.4, 1.8, 1.6, .8, .8, .8, .8] },
    { id: 'medical', name: 'Medical and insurance', unit: m => 6e3 * m.col, fx: 0.6, growth: 0.05, season: flat },
    { id: 'ops', name: 'Mission operations and local staff', unit: m => 20e3 * m.col, fixed: m => 150e3 * m.col, fx: 1, growth: 0.025, season: flat },
  ];
  LINES.forEach(l => { const s = l.season.reduce((a, b) => a + b, 0); l.w = l.season.map(v => v / s); });

  // actual exchange rate against the budget rate, % dearer (+) or cheaper (-) in BND terms: [Jan-Jun, Jul-Oct]
  const FX = { USD: [0.5, 3.1], GBP: [1.0, 3.6], EUR: [0.5, 1.6], CHF: [0.8, 2.2], JPY: [-2.0, -1.4], MYR: [-1.0, -0.6], IDR: [-1.5, -1.2],
    SGD: [0, 0], CNY: [0.4, 0.9], SAR: [0.5, 3.1], QAR: [0.5, 3.1], AED: [0.5, 3.1], AUD: [-1.0, -0.4], THB: [0.5, 0.8], PHP: [0, 0.3],
    VND: [0.4, 2.0], KRW: [-1.0, -0.5], INR: [-0.5, -0.2], EGP: [-4.0, -3.0], PKR: [-3.0, -2.2] };
  const fxDev = (m, t) => FX[m.ccy][t < 6 ? 0 : 1] / 100;
  const RENEWAL = { LON: 0.17, NYC: 0.34 };          // leases renewed above indexation from July

  const R2 = mulberry(77);
  let K = 1;
  const fin = {};                                    // fin[mission][line] = {b:[12], a:[12], hc:[12], fx:[12], house:[12], other:[12]}
  function buildFin() {
    MISSIONS.forEach(m => {
      fin[m.id] = {};
      LINES.forEach(l => {
        const c = { b: [], a: [], hc: [], fx: [], house: [], other: [] };
        for (let t = 0; t < 12; t++) {
          const fixed = l.fixed ? l.fixed(m) * K : 0;
          const base = (fixed + l.unit(m) * K * m.posts) * l.w[t];
          const hcEff = l.unit(m) * K * (m.hc - m.posts) * l.w[t];
          const after = base + hcEff;
          const fxEff = after * l.fx * fxDev(m, t);
          const house = l.id === 'housing' && RENEWAL[m.id] && t >= 6 ? after * RENEWAL[m.id] : 0;
          const other = after * (c.noise ? c.noise[t] : 0);
          c.b.push(base); c.hc.push(hcEff); c.fx.push(fxEff); c.house.push(house); c.other.push(other);
          c.a.push(after + fxEff + house + other);
        }
        fin[m.id][l.id] = c;
      });
    });
  }
  const noise = {};
  MISSIONS.forEach(m => { noise[m.id] = {}; LINES.forEach(l => { noise[m.id][l.id] = Array.from({ length: 12 }, () => (R2() - 0.5) * 0.04); }); });
  function buildFinNoise() {
    MISSIONS.forEach(m => LINES.forEach(l => {
      const c = fin[m.id][l.id];
      for (let t = 0; t < 12; t++) { const after = c.b[t] + c.hc[t]; c.other[t] = after * noise[m.id][l.id][t]; c.a[t] = after + c.fx[t] + c.house[t] + c.other[t]; }
    }));
  }
  buildFin(); buildFinNoise();
  { // scale so that cost for January to October comes to B$ 41.8m, as on the printed quotation screens
    let s = 0;
    MISSIONS.forEach(m => LINES.forEach(l => { for (let t = 0; t < YTD; t++) s += fin[m.id][l.id].a[t]; }));
    K = 41.8e6 / s; buildFin(); buildFinNoise();
  }

  const sumT = (arr, t0, t1) => { let s = 0; for (let t = t0; t < t1; t++) s += arr[t]; return s; };
  // totals for a set of missions over months [t0, t1)
  function finSum(ms, t0, t1) {
    t0 = t0 || 0; t1 = t1 == null ? YTD : t1;
    const out = { a: 0, b: 0, hc: 0, fx: 0, house: 0, other: 0, lines: {} };
    LINES.forEach(l => { out.lines[l.id] = { a: 0, b: 0 }; });
    ms.forEach(m => LINES.forEach(l => {
      const c = fin[m.id][l.id];
      ['a', 'b', 'hc', 'fx', 'house', 'other'].forEach(k => { out[k] += sumT(c[k], t0, t1); });
      out.lines[l.id].a += sumT(c.a, t0, t1); out.lines[l.id].b += sumT(c.b, t0, t1);
    }));
    out.v = out.a - out.b; out.vp = out.b ? out.v / out.b : 0;
    return out;
  }
  function finMonthly(ms) {
    const a = Array(12).fill(0), b = Array(12).fill(0);
    ms.forEach(m => LINES.forEach(l => { const c = fin[m.id][l.id]; for (let t = 0; t < 12; t++) { a[t] += c.a[t]; b[t] += c.b[t]; } }));
    return { a, b };
  }

  /* ---------- history, 2023 to 2025 (illustrative), for charts over time ----------
     Built backwards from 2026 with its own random stream, so no figure elsewhere changes. */
  const R3 = mulberry(2023);
  const hcHist = {}, finHist = {};
  MISSIONS.forEach(m => {
    hcHist[m.id] = { 2026: m.hc };
    let hc = m.hc;
    for (let y = 2025; y >= 2023; y--) { const r = R3(); hc = Math.max(2, hc + (r < 0.25 ? -1 : r > 0.85 ? 1 : 0)); hcHist[m.id][y] = hc; }
    finHist[m.id] = {};
    LINES.forEach(l => {
      const c = fin[m.id][l.id], h = finHist[m.id][l.id] = { 2026: { a: sumT(c.a, 0, 12), b: sumT(c.b, 0, 12) } };
      let a = h[2026].a;
      for (let y = 2025; y >= 2023; y--) {
        const prices = 1 + l.growth + 0.01 + (R3() - 0.5) * 0.04;
        const size = l.id === 'ops' ? 1 : hcHist[m.id][y + 1] / hcHist[m.id][y];
        a = a / (prices * size);
        h[y] = { a, b: a * (1 + (R3() - 0.42) * 0.06) };
      }
    });
  });
  // retirements by grade, 2023 to October 2026, and other exits so far in 2026
  const RET_HIST = { 2023: { I: 3, II: 7, III: 2 }, 2024: { I: 2, II: 8, III: 3 }, 2025: { I: 4, II: 9, III: 2 }, 2026: { I: 2, II: 7, III: 2 } };
  const EXIT_2026 = { I: 0, II: 4, III: 3 };

  /* ---------- one past year, for the Year filter ----------
     Read from the same yearly history as the charts over time, so the two always agree. */
  const YEARS = [2023, 2024, 2025, 2026];
  // cost and allocation for a set of missions in one year (2026: ten months of actuals plus two estimated)
  function finYear(ms, y) {
    const out = { y, a: 0, b: 0, hc: 0, lines: {} };
    LINES.forEach(l => { out.lines[l.id] = { a: 0, b: 0 }; });
    ms.forEach(m => {
      out.hc += hcHist[m.id][y];
      LINES.forEach(l => { const x = finHist[m.id][l.id][y]; out.a += x.a; out.b += x.b; out.lines[l.id].a += x.a; out.lines[l.id].b += x.b; });
    });
    out.v = out.a - out.b; out.vp = out.b ? out.v / out.b : 0;
    return out;
  }
  // officers in service at the end of a year, by grade (2026: at the data date)
  function headAt(y) {
    const x = ATTR_HIST.find(r => r.y === y), out = {};
    GRADES.forEach(g => { out[g] = x ? x[g][1] : officers.filter(o => o.grade === g).length; });
    return out;
  }
  // officers who left in a year, by grade: retirements and other exits (2026: to the data date)

  /* ---------- ask: a management question, answered across the four analytics levels ----------

  const MALIAS = D.MISSIONS.map(m => [m.name.replace(/\s*\(.*\)/, '').toLowerCase(), m]).concat(Object.entries({

  }).flatMap(([id, names]) => names.split('|').map(n => [n, D.M[id]])));

  function parseQ(raw) {
    const q = ' ' + raw.toLowerCase().replace(/[?!,;:]/g, ' ').replace(/\s+/g, ' ') + ' ';
    const has = re => re.test(q), num = re => { const x = q.match(re); return x ? parseFloat(x[1]) : null; };
    const me = MALIAS.find(a => new RegExp('\\b' + a[0] + '\\b').test(q)), m = me ? me[1] : null;
    const gm = q.match(/\bdiv(?:ision)?\.? ?(iii|ii|i|3|2|1)\b/);
    let grade = gm ? { iii: 'III', ii: 'II', i: 'I', 3: 'III', 2: 'II', 1: 'I' }[gm[1]] : null;
    if (!grade && has(/head of mission|ambassador|high commissioner/)) grade = 'I';
    const ym = q.match(/\b20(2[7-9]|3[01])\b/), horizon = ym ? +('20' + ym[1]) : null;
    const p = { m, grade, horizon, intent: 'none' };
    const wi = has(/\bwhat if\b|\bif we\b|\bsuppose\b|\binstead of\b|\bscenario\b|\bwhat happens\b|\bimpact of\b|\beffect of\b|\bwhat would\b/);
    const pct = num(/(\d+(?:\.\d+)?) ?(?:%|per ?cent)/), yrs = num(/(\d(?:\.5)?)[ -]?(?:years?|yrs?)\b/);
    const down = has(/\bcut|reduc|lower|fewer|less\b|decreas|\bdown\b|shrink|clos/);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    if (has(/\bwho should\b|\bwhom should\b|\bwho is (?:the )?best\b|\bbest (?:officer|candidate|person)|\brecommend (?:an?|the|some|me)? ?(?:officer|candidate|person|name)|\bshould (?:we|i) (?:promote|post|appoint|send)\b|\bwho (?:deserves|to promote|to appoint|to post|gets)\b|\brank (?:the |our )?(?:officers|candidates)/)) p.intent = 'guard';
    else if (!wi && has(/\b(?:chart|graph|plot|trend|year by year|by year|per year|yearly|over time|month by month|monthly|by month|by quarter|quarterly|breakdown|break down|compar\w*|table of|histor\w*|by (?:mission|grade|division|department|region|cost line|line|age)|per (?:mission|grade|department)|across missions)\b/)) { p.intent = 'chart'; p.chart = parseChart(q, p); }
    else if (has(/posting|tour|rotation/) && yrs != null && (wi || has(/-year|year postings?|years? long/))) { const v = clamp(yrs, 2, 5); p.intent = 'whatif'; p.lever = { name: v + '-year postings', set: { postLen: v, postLenHard: v }, kind: 'postLen' }; }

    else if (has(/exchange|currenc|\bfx\b|brunei dollar|\busd\b|us dollar|pound|ringgit/) && pct != null) { const local = has(/brunei dollar|\bbnd\b|our (?:dollar|currency)/), strong = has(/\bstronger|\bstrengthen|\bappreciat|\brises?\b|\bgains?\b/), weak = has(/\bweak|\bdepreciat|\bfalls?\b|\bdrops?\b|\bloses?\b/);
      const cheaper = has(/\bcheaper|in our favou?r|\bfavou?rabl|\bimprov/) || (local ? strong : weak);
      const v = clamp(cheaper ? -pct : pct, -10, 10); p.intent = 'whatif'; p.lever = { name: 'Exchange rates ' + Math.abs(v) + '% ' + (v > 0 ? 'dearer' : 'cheaper'), set: { fxStress: v }, kind: 'fx' }; }
    else if (has(/housing|rent/) && pct != null && wi) { const v = clamp(pct, 0, 8); p.intent = 'whatif'; p.lever = { name: 'Housing cost growth ' + v + '% a year', set: { housingIdx: v }, kind: 'housing' }; }
    else if (has(/recruit|intake|hire|hiring/) && num(/(\d+)/) != null && wi) { const v = clamp(num(/(\d+)/), 0, 40); p.intent = 'whatif'; p.lever = { name: 'Intake of ' + v + ' a year', set: { intake: v }, kind: 'intake' }; }

      const n = num(/(\d+) (?:more |additional |extra |fewer |less )?(?:officers|posts|staff|diplomats)/), v = clamp(down ? -n : n, -20, 20);
      p.intent = 'whatif'; p.lever = { name: (v > 0 ? v + ' more' : Math.abs(v) + ' fewer') + ' officers overseas', set: { postsDelta: v }, kind: 'posts' };
    }
    else if (has(/cost (?:of|to) (?:post|send|keep|station|hav|plac)|cost per officer|per officer|how much (?:does|is|do|would) .*(?:officer|posting|post )/)) p.intent = 'costpost';
    else if (has(/rotat|overdue|past due|past their|due for|due to return|coming home|\breplace|postings? (?:due|end)|tours? (?:due|end)/)) p.intent = 'rotation';
    else if (has(/over (?:the |their )?(?:allocation|budget)|overspen|overrun|variance|budget|allocation|\bspend|why .*cost|cost.*why|expens|cost driver|costs? (?:going|rising|up)|mission costs?|financ/)) p.intent = 'cost';
    else if (has(/train|\bcourses?\b|\bworkshops?\b|\bseminars?\b/)) p.intent = 'training';
    else if (has(/skill|competenc|language|arabic|mandarin|french|expertise|capabilit/)) p.intent = 'skills';
